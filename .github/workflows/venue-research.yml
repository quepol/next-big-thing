name: Venue research

# One-off research for issue #4: SF trusted-venue overlap with Toronto venues.
# Writes site/data/venue_research.json to the pushing branch. Not part of the daily
# pipeline. The push trigger exists because workflow_dispatch only works once a
# workflow is on the default branch. Re-run to resume if the setlist.fm daily limit
# cut it short: the API cache is kept between runs.
on:
  push:
    branches: [claude/music-venue-alerts-ayb8hs]
    # Only its own script: each run spends setlist.fm's ~1,440-call daily budget, so
    # changes to another study (or to this file) mustn't set it off. Re-run by
    # changing venue_overlap.py, or from the Actions tab once this is on main.
    paths: ["research/venue_overlap.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: venue-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Restore (never save) the daily pipeline's API cache, so building the taste
      # model for tiers reuses its Last.fm lookups instead of repeating them.
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: api-cache-none
          restore-keys: api-cache-
      # Keep this step's path unchanged: the path is part of the cache version, and a
      # changed path silently misses the saved setlist.fm data.
      - uses: actions/cache@v4
        with:
          path: research/cache.json
          key: venue-research-${{ github.run_id }}
          restore-keys: venue-research-
      - uses: actions/cache@v4
        with:
          path: data/cache/artist_info.json
          # v2: v1 cached wrong pages looked up with typographic quotes.
          key: venue-research-lastfm-v2-${{ github.run_id }}
          restore-keys: venue-research-lastfm-v2-
      - name: Run research
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -u research/venue_overlap.py
      - name: Commit results
        run: |
          git config user.name "nbt-bot"
          git config user.email "nbt-bot@users.noreply.github.com"
          git add site/data/venue_research.json
          git diff --cached --quiet || git commit -m "Venue research results $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
