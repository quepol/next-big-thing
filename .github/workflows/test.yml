name: Tests

# Python tests only. Run on main: the dev branch gets the same commits seconds
# earlier on every ship, and pytest runs locally before each push anyway. Docs,
# site and data commits (including the daily snapshot) have nothing to test.
on:
  push:
    branches: [main]
    paths: ["nbt/**", "tests/**", "requirements.txt", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
