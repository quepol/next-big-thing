name: Last.fm probe

# One-off diagnostics: prints Last.fm's raw answers for a few artists. Commits nothing.
# Runs when its script changes on the dev branch.
on:
  push:
    branches: [claude/music-venue-alerts-ayb8hs]
    paths: ["scripts/lastfm_probe.py", ".github/workflows/lastfm-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: PYTHONPATH=. python -u scripts/lastfm_probe.py
