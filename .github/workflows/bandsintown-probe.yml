name: Bandsintown probe

# One-off check of Bandsintown's past-events data for the venue ladder (issue #4).
# Writes research/bandsintown_probe.json to the pushing branch.
on:
  push:
    branches: [claude/music-venue-alerts-ayb8hs]
    paths: ["research/bandsintown_probe.py", ".github/workflows/bandsintown-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: python -u research/bandsintown_probe.py
      - name: Commit results
        run: |
          git config user.name "nbt-bot"
          git config user.email "nbt-bot@users.noreply.github.com"
          git add research/bandsintown_probe.json
          git diff --cached --quiet || git commit -m "Bandsintown probe results $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
