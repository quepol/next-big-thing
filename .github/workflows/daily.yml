name: Daily digest

# Two jobs share this workflow: the scheduled run (pipeline, commit, deploy) and a
# deploy-only run when site files change on main. Both publish the one Pages site,
# so they share a concurrency group and queue rather than overlap.
#
# The schedule has a backup: GitHub starts scheduled runs late, or drops them on busy
# days (2026-10-19 never ran). The second cron does nothing if today's digest is
# already on main. Both are set ~5 hours early: in Oct 2026 the 10:17 UTC cron
# reliably started around 15:00 UTC, so 05:17 should land near 6am Toronto.
on:
  schedule:
    - cron: "17 5 * * *" # 1:17am Toronto on paper; ~6am with GitHub's usual delay
    - cron: "47 9 * * *" # backup: ~5:47am on paper, ~10:30am in practice
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    # The first run backfills ~20 years of scrobbles; later runs take minutes.
    timeout-minutes: 300
    env:
      # A push to site/** only redeploys; it publishes the digest already on main.
      DEPLOY_ONLY: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scheduled runs only: skip when main already has today's digest (Toronto date).
      # Reads origin/main fresh, in case the earlier run finished after this one was queued.
      - name: Already ran today?
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          git fetch -q origin main
          made=$(git show origin/main:site/data/digest.json | python3 -c "import json,sys; print(json.load(sys.stdin)['generated_at'])")
          day=$(TZ=America/Toronto date -d "$made" +%F)
          if [ "$day" = "$(TZ=America/Toronto date +%F)" ]; then
            echo "Today's digest is already on main ($made); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: env.DEPLOY_ONLY != 'true' && steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        if: env.DEPLOY_ONLY != 'true' && steps.fresh.outputs.skip != 'true'
      # API responses are a cache, not a dataset: keep them out of git.
      - uses: actions/cache@v5
        if: env.DEPLOY_ONLY != 'true' && steps.fresh.outputs.skip != 'true'
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Run pipeline
        if: env.DEPLOY_ONLY != 'true' && steps.fresh.outputs.skip != 'true'
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          # Repository variables; unset means the defaults in nbt/config.py.
          LASTFM_USER: ${{ vars.LASTFM_USER }}
          SETLISTFM_USER: ${{ vars.SETLISTFM_USER }}
        run: |
          # One-time history rebuild, requested by committing data/rebuild-history. It
          # re-downloads every scrobble so each artist gets days_by_year. The old history is
          # kept unless the new one is complete (at least as many play days), so a failed
          # or partial rebuild can never reach the digest; the flag then stays for a retry.
          if [ -f data/rebuild-history ]; then
            cp data/history.json "$RUNNER_TEMP/history.bak"
            if python -m nbt rebuild-history && python scripts/check_rebuild.py "$RUNNER_TEMP/history.bak" data/history.json; then
              git rm -q data/rebuild-history
            else
              echo "::warning::History rebuild failed or came back short; kept the old history."
              cp "$RUNNER_TEMP/history.bak" data/history.json
            fi
          fi
          python -m nbt run
      # Rebase onto whatever landed on main during the run, so the push isn't
      # rejected and the deploy below carries the latest site files.
      - name: Commit snapshots and digest
        if: always() && env.DEPLOY_ONLY != 'true' && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "nbt-bot"
          git config user.email "nbt-bot@users.noreply.github.com"
          git add data site/data/digest.json || true
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-pages-artifact@v3
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
