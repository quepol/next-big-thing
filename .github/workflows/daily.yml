name: Daily digest

on:
  schedule:
    - cron: "17 10 * * *" # ~6am Toronto
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The first run backfills ~20 years of scrobbles; later runs take minutes.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # API responses are a cache, not a dataset: keep them out of git.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-
      - name: Run pipeline
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
        run: python -m nbt run
      - name: Commit snapshots and digest
        if: always()
        run: |
          git config user.name "nbt-bot"
          git config user.email "nbt-bot@users.noreply.github.com"
          git add data site/data/digest.json || true
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
