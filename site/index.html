<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Big Thing</title>
  <script>
    // Apply a saved theme before first paint to avoid a light/dark flash.
    try { const t = JSON.parse(localStorage.getItem("nbt.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <!-- Fonts match OpenPublic.cc: Inter for text, Momo Trust Display (self-hosted, see style.css) for the title. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="NBT">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Next Big Thing</h1>
    </div>
    <p id="meta" class="muted"></p>
    <div class="tabs-wrap">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tier="next_big_thing">Next big thing</button>
      <button role="tab" data-tier="would_like">You'd probably like</button>
      <button role="tab" data-tier="know">Bands you know</button>
      <button role="tab" data-tier="rooms">Your rooms</button>
    </nav>
    </div>
  </header>
  <div id="banner" hidden></div>
  <div id="roombar" hidden>
    <p class="muted">Upcoming shows at the rooms you follow, ranked for you. Tap a room; ☆ follows or unfollows it.</p>
    <div id="roomchips" class="roomchips"></div>
  </div>
  <div id="toolbar" hidden>
    <span class="toolbar-left">
      <span id="count" class="muted"></span>
      <button type="button" id="follow" class="follow" hidden></button>
    </span>
    <label class="sort">Sort
      <select id="sort">
        <option value="score">Best match</option>
        <option value="date">Soonest</option>
        <option value="venue">Venue</option>
        <option value="artist">Artist</option>
      </select>
    </label>
  </div>
  <main id="list" aria-live="polite"></main>
  <footer class="site-foot" data-page="picks"></footer>

  <template id="card">
    <article class="card">
      <div class="when" aria-hidden="true">
        <span class="dow"></span><span class="day"></span><span class="mon"></span><span class="rel"></span>
      </div>
      <div class="body">
        <div class="head">
          <h2 class="artist"></h2>
          <span class="strength">
            <span class="pips"><i></i><i></i><i></i></span>
            <span class="label"></span>
            <span class="score"></span>
          </span>
        </div>
        <p class="where"></p>
        <ul class="chips"></ul>
        <ul class="why"></ul>
        <div class="foot">
          <span class="listen"></span>
          <a class="tickets" target="_blank" rel="noopener">Tickets ↗</a>
          <span class="vote">
            <button type="button" data-v="up" aria-label="More like this"></button>
            <button type="button" data-v="down" aria-label="Not for me"></button>
          </span>
        </div>
      </div>
    </article>
  </template>
  <template id="collapsed">
    <article class="card collapsed">
      <span class="c-date"></span>
      <span class="c-artist"></span>
      <span class="c-note">Hidden</span>
      <button type="button" class="undo">Undo</button>
    </article>
  </template>
  <script src="foot.js"></script>
  <script src="ladder.js"></script>
  <script src="rooms.js"></script>
  <script src="app.js"></script>
</body>
</html>
