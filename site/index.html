<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Big Thing</title>
  <script>
    // Apply a saved theme before first paint to avoid a light/dark flash.
    try { const t = JSON.parse(localStorage.getItem("nbt.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <!-- Fonts match OpenPublic.cc: Inter for text, Momo Trust Display (self-hosted, see style.css) for the title. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Next Big Thing</h1>
      <div id="theme" class="theme-switch" role="radiogroup" aria-label="Colour theme">
        <button type="button" role="radio" data-choice="light" aria-label="Light" title="Light"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg></button>
        <button type="button" role="radio" data-choice="dark" aria-label="Dark" title="Dark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg></button>
        <button type="button" role="radio" data-choice="auto" aria-label="System" title="Match system"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1.25"/><path d="M5.5 14h5M8 11v3"/></svg></button>
      </div>
    </div>
    <p id="meta" class="muted"></p>
    <div class="tabs-wrap">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tier="next_big_thing">Next big thing</button>
      <button role="tab" data-tier="would_like">You'd probably like</button>
      <button role="tab" data-tier="know">Bands you know</button>
      <button role="tab" data-tier="ledger">Ledger</button>
      <button role="tab" data-tier="attended">Attended</button>
    </nav>
    </div>
  </header>
  <div id="banner" hidden></div>
  <div id="toolbar" hidden>
    <span id="count" class="muted"></span>
    <label class="sort">Sort
      <select id="sort">
        <option value="score">Best match</option>
        <option value="date">Soonest</option>
        <option value="venue">Venue</option>
        <option value="artist">Artist</option>
      </select>
    </label>
  </div>
  <main id="list" aria-live="polite"></main>
  <footer class="site-foot">
    <span id="loaded"></span> · <button type="button" id="refresh">Refresh</button>
  </footer>

  <template id="card">
    <article class="card">
      <div class="when" aria-hidden="true">
        <span class="dow"></span><span class="day"></span><span class="mon"></span><span class="rel"></span>
      </div>
      <div class="body">
        <div class="head">
          <h2 class="artist"></h2>
          <span class="strength">
            <span class="pips"><i></i><i></i><i></i></span>
            <span class="label"></span>
            <span class="score"></span>
          </span>
        </div>
        <p class="where"></p>
        <ul class="chips"></ul>
        <ul class="why"></ul>
        <div class="foot">
          <span class="listen"></span>
          <a class="tickets" target="_blank" rel="noopener">Tickets ↗</a>
          <span class="vote">
            <button type="button" data-v="up" aria-label="More like this"></button>
            <button type="button" data-v="down" aria-label="Not for me"></button>
          </span>
        </div>
      </div>
    </article>
  </template>
  <template id="collapsed">
    <article class="card collapsed">
      <span class="c-date"></span>
      <span class="c-artist"></span>
      <span class="c-note">Hidden</span>
      <button type="button" class="undo">Undo</button>
    </article>
  </template>
  <script src="app.js"></script>
</body>
</html>
