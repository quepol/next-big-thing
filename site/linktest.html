<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link test</title>
  <script>
    try { const t = JSON.parse(localStorage.getItem("nbt.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
  <style>
    ol { padding-left: 20px; }
    li { margin: 0 0 18px; }
    li a { color: var(--accent); font-weight: 600; text-decoration: none; }
    code { font-size: 12px; color: var(--muted); word-break: break-all; }
  </style>
</head>
<!-- Temporary: which SoundCloud link fills in the app's search? Delete once answered. -->
<body>
  <header>
    <h1>SoundCloud link test</h1>
    <p class="muted">Tap each link on the phone, note whether the SoundCloud app opens with "Allison Russell" already searched, then come back here. Temporary page; it'll be deleted.</p>
  </header>
  <main>
    <ol id="links"></ol>
  </main>
  <script>
    const q = encodeURIComponent("Allison Russell");
    const links = [
      ["Current link (search)", `https://soundcloud.com/search?q=${q}`],
      ["Tracks search", `https://soundcloud.com/search/sounds?q=${q}`],
      ["People search", `https://soundcloud.com/search/people?q=${q}`],
      ["App scheme", `soundcloud://search?q=${q}`],
      ["App scheme, tracks", `soundcloud://search/sounds?q=${q}`],
      ["Mobile site", `https://m.soundcloud.com/search?q=${q}`],
    ];
    const ol = document.getElementById("links");
    for (const [label, href] of links) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = href; a.textContent = label;
      li.append(a, document.createElement("br"));
      const c = document.createElement("code"); c.textContent = href; li.append(c);
      ol.append(li);
    }
  </script>
</body>
</html>
